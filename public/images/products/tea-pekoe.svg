<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EB"/>
      <stop offset="100%" stop-color="#E8E2D5"/>
    </linearGradient>
    <linearGradient id="canister" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B2F23"/>
      <stop offset="50%" stop-color="#2D4D3A"/>
      <stop offset="100%" stop-color="#15261C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e2d24" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <ellipse cx="200" cy="350" rx="90" ry="18" fill="#d0c7b6" opacity="0.6"/>
  <!-- Canister Body -->
  <g filter="url(#shadow)">
    <rect x="130" y="110" width="140" height="210" rx="14" fill="url(#canister)"/>
    <!-- Lid -->
    <rect x="124" y="90" width="152" height="26" rx="6" fill="url(#gold)"/>
    <!-- Label -->
    <rect x="144" y="150" width="112" height="130" rx="4" fill="#FAF8F5"/>
    <rect x="148" y="154" width="104" height="122" rx="2" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Label text & emblem -->
    <path d="M200 170 C190 180, 192 192, 200 196 C208 192, 210 180, 200 170 Z" fill="#2D4D3A"/>
    <text x="200" y="215" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="bold" fill="#1B2F23" text-anchor="middle" letter-spacing="1.5">UWANI CEYLON</text>
    <text x="200" y="232" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#AA771C" text-anchor="middle">NUWARA ELIYA</text>
    <text x="200" y="246" font-family="'Cinzel', serif" font-size="12" font-style="italic" fill="#2D4D3A" text-anchor="middle">Orange Pekoe</text>
    <line x1="168" y1="254" x2="232" y2="254" stroke="#D4AF37" stroke-width="1"/>
    <text x="200" y="265" font-family="'Inter', sans-serif" font-size="7.5" fill="#666" text-anchor="middle">100g Loose Leaf • Single Estate</text>
  </g>
</svg>